<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: rgb(255, 245, 227);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .card {
    background: darkblue;
    width: 100%;
    max-width: 380px;
    padding: 40px 32px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    border: 1px solid #eaeaea;
  }

  .card h1 {
    font-size: 22px;
    font-weight: 600;
    color: #ebebeb;
    margin-bottom: 6px;
  }

  .card .subtitle {
    font-size: 14px;
    color: #c0c0c0;
    margin-bottom: 28px;
  }

  .field {
    margin-bottom: 18px;
  }

  .field label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: #dddddd;
    margin-bottom: 6px;
  }

  .field input {
    width: 100%;
    padding: 11px 12px;
    font-size: 14px;
    border: 1px solid #d9d9d9;
    border-radius: 8px;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .field input:focus {
    border-color: #4f7cff;
    box-shadow: 0 0 0 3px rgba(79, 124, 255, 0.15);
  }


  .submit {
    width: 100%;
    padding: 12px;
    background: #4f7cff;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .submit:hover {
    background: #3d68f0;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 22px 0;
    color: #aaa;
    font-size: 12px;
  }

  .divider::before,
  .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #eee;
  }

  .signup {
    text-align: center;
    font-size: 13px;
    color: #bfbfbf;
  }

  .signup a {
    color: #4f7cff;
    text-decoration: none;
    font-weight: 500;
  }

  .signup a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

  <div class="card">
    <h1>Welcome back</h1>
    <p class="subtitle">Log in to your account to continue</p>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>

   

      <button type="submit" class="submit">Log in</button>
    </form>

    <div class="divider">OR</div>

    <p class="signup">Don't have an account? <a href="#">Sign up</a></p>
  </div>

<script>
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    if (email === 'koiralabikalpa665@gmail.com' && password === 'admin') {
      window.location.href = 'homepage.html';
    } else {
      alert('Login failed. Please check your email and password.');
    }
  });
</script>

</body>
</html>
